<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 16px; font: 14px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #111; }
  h1 { font-size: 15px; margin: 0 0 8px; color: #ff0033; }
  ul { margin: 0; padding-right: 18px; }
  kbd { background: #eee; border-radius: 4px; padding: 1px 6px; font-family: inherit; }
  p { margin: 8px 0 0; color: #555; font-size: 13px; }
  #status { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #f3f3f3; font-size: 13px; }
  button { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #111; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  .v { margin-top: 10px; color: #888; font-size: 12px; }
</style>
<style>#fo2sh-update{margin-top:8px;font-size:12px;color:#0a7d3b}#fo2sh-update.fo2sh-new{padding:8px 10px;border-radius:8px;background:#fff4e5;color:#8a4b00;font-weight:600}</style>
</head>
<body>
  <h1>Fo2sh YouTube Downloader</h1>
  <ul>
    <li>اقف على أي فيديو أو Short، أو صورته في الصفحة الرئيسية</li>
    <li>دوس <b>تنزيل</b> أو <kbd>D</kbd> واختار الجودة أو الصوت</li>
    <li>الملفات بتنزل في <b>Downloads/YouTube</b></li>
  </ul>
  <div id="status">بيتأكد من البرنامج المساعد...</div>
  <button id="update">تحديث yt-dlp (لو التحميل بطّل يشتغل)</button>
  <div class="v">Version 1.1.1</div>
  <script src="popup.js"></script>
  <div id="fo2sh-update"></div>
  <script src="update-check.js"></script>
</body>
</html>
